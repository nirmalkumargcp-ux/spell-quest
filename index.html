<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Spell Quest — Picture Spelling!</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐨</text></svg>" />
<style>
  /* ---------------------------------------------------------------
     SPELL QUEST — Picture Spelling.
     A photo appears, the word is spoken, and the child types it.
     • 10 words per round. Right = 1 point (flies LEFT). Wrong = flies RIGHT.
     • Score X/10 at the end; must get 10/10 to climb to the next level.
     • Missed words + new same-level words come back next round.
     • Profile keeps every word the child knows.
     Photos: ./images   Audio (Samantha voice): ./audio   — works offline.
  ----------------------------------------------------------------*/
  :root{
    --pink:#ff6ea9; --purple:#8b5cf6; --blue:#38bdf8; --green:#34d399;
    --yellow:#fbbf24; --orange:#fb923c; --red:#f87171;
    --ink:#3b2a63; --card:#ffffff; --soft:#f4f0ff;
    --shadow:0 10px 0 rgba(59,42,99,.12), 0 16px 28px rgba(59,42,99,.18);
    --round:24px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0;}
  body{
    font-family:"Baloo 2","Comic Sans MS","Trebuchet MS",system-ui,-apple-system,sans-serif;
    color:var(--ink);
    background:linear-gradient(135deg,#a78bfa 0%,#f0abfc 35%,#7dd3fc 70%,#6ee7b7 100%);
    background-size:300% 300%; animation:bgshift 18s ease infinite;
    overflow:hidden; user-select:none; -webkit-user-select:none; touch-action:manipulation;
  }
  @keyframes bgshift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  .bubbles{position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0;}
  .bubbles span{position:absolute; bottom:-80px; font-size:38px; opacity:.5; animation:rise linear infinite;}
  @keyframes rise{to{transform:translateY(-115vh) rotate(220deg); opacity:0;}}

  #app{position:relative; z-index:1; height:100%; width:100%; display:flex; flex-direction:column;
       align-items:center; justify-content:center; padding:14px; text-align:center; overflow:auto;}
  #app.playing{justify-content:flex-start; padding-top:10px;}
  .screen{width:100%; max-width:900px; margin:auto; animation:pop .35s cubic-bezier(.2,1.3,.4,1);}
  #app.playing .screen{margin:0 auto;}
  @keyframes pop{from{transform:scale(.92); opacity:0} to{transform:scale(1); opacity:1}}

  h1.logo{font-size:clamp(36px,8vw,72px); margin:0 0 2px; color:#fff;
    text-shadow:0 4px 0 rgba(139,92,246,.5), 0 8px 18px rgba(59,42,99,.35);}
  .tag{color:#fff; font-size:clamp(15px,3.2vw,22px); margin:0 0 16px; text-shadow:0 2px 8px rgba(59,42,99,.3);}

  .btn{border:none; cursor:pointer; font-family:inherit; font-weight:800; color:#fff; border-radius:var(--round);
    padding:15px 24px; font-size:clamp(17px,3.2vw,25px); box-shadow:var(--shadow);
    transition:transform .12s, filter .12s; background:var(--purple);}
  .btn:active{transform:translateY(4px) scale(.98); filter:brightness(1.05);}
  .btn:disabled{opacity:.45; filter:grayscale(.4); cursor:default;}
  .btn.big{padding:20px 40px; font-size:clamp(22px,4.4vw,34px);}
  .btn.play{background:linear-gradient(180deg,#4ade80,#22c55e);}
  .btn.blue{background:linear-gradient(180deg,#5cc9f5,#0ea5e9);}
  .btn.yellow{background:linear-gradient(180deg,#fcd34d,#f59e0b); color:#7a4a00;}
  .btn.pink{background:linear-gradient(180deg,#fb7fb4,#ec4899);}
  .btn.ghost{background:rgba(255,255,255,.9); color:var(--purple); box-shadow:0 7px 0 rgba(139,92,246,.22);}

  .card{background:var(--card); border-radius:30px; box-shadow:var(--shadow); padding:20px;}
  #app.playing .card{padding:12px 16px;}

  .statbar{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin:6px 0 18px;}
  .chip{background:rgba(255,255,255,.92); border-radius:999px; padding:9px 18px; font-size:clamp(15px,2.8vw,20px);
        font-weight:800; color:var(--ink); box-shadow:0 5px 0 rgba(59,42,99,.12); display:flex; align-items:center; gap:7px;}

  /* level cards */
  .levels{display:flex; gap:16px; justify-content:center; flex-wrap:wrap;}
  .level{width:210px; max-width:82vw; cursor:pointer; position:relative; transition:transform .15s;}
  .level:active{transform:translateY(4px) scale(.98);}
  .level .face{border-radius:26px; padding:18px 16px; box-shadow:var(--shadow); color:#fff;}
  .level.l1 .face{background:linear-gradient(180deg,#60a5fa,#2563eb);}
  .level.l2 .face{background:linear-gradient(180deg,#f472b6,#db2777);}
  .level.l3 .face{background:linear-gradient(180deg,#34d399,#059669);}
  .level.l4 .face{background:linear-gradient(180deg,#c084fc,#7c3aed);}
  .level.l5 .face{background:linear-gradient(180deg,#fbbf24,#d97706);}
  .level.l6 .face{background:linear-gradient(180deg,#fb7185,#e11d48);}
  .level.locked .face{filter:grayscale(.7) brightness(.85);}
  .level .emoji{font-size:48px; line-height:1;}
  .level h3{margin:6px 0 2px; font-size:23px;}
  .level p{margin:0; font-size:15px; opacity:.95;}
  .level .badge2{position:absolute; top:8px; right:12px; font-size:26px;}
  .progwrap{height:13px; background:rgba(255,255,255,.35); border-radius:999px; margin-top:9px; overflow:hidden;}
  .progwrap i{display:block; height:100%; width:0; background:linear-gradient(90deg,#fde047,#facc15); border-radius:999px; transition:width .5s;}

  /* play top bar + timer */
  .top{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px;}
  .timerwrap{flex:1; display:flex; align-items:center; gap:10px;}
  .tbar{flex:1; height:20px; background:rgba(255,255,255,.55); border-radius:999px; overflow:hidden; box-shadow:inset 0 2px 4px rgba(59,42,99,.15);}
  .tbar i{display:block; height:100%; width:100%; background:linear-gradient(90deg,#4ade80,#22c55e); transition:width .12s linear, background .3s;}
  .tsec{min-width:70px; justify-content:center;}

  .picwrap{display:flex; align-items:center; justify-content:center; margin:0 0 6px;}
  .picture{height:clamp(120px,22vh,205px); max-width:100%; border-radius:20px; object-fit:cover;
    box-shadow:0 8px 20px rgba(59,42,99,.28); border:5px solid #fff; background:#eee;}
  .picfallback{display:none; height:clamp(120px,22vh,205px); width:clamp(120px,22vh,205px); border-radius:20px; align-items:center; justify-content:center;
    font-size:clamp(84px,16vh,150px); background:var(--soft); box-shadow:0 8px 20px rgba(59,42,99,.28); border:5px solid #fff;}
  .speaker{font-size:clamp(26px,5vh,44px); background:none; border:none; cursor:pointer; transition:transform .12s; line-height:1;}
  .speaker:active{transform:scale(.9);}

  .slots{display:flex; gap:7px; justify-content:center; flex-wrap:wrap; margin:2px 0 10px; min-height:48px;}
  .slot{width:clamp(32px,6.5vw,50px); height:clamp(42px,8vw,58px); border-radius:13px; background:var(--soft);
        border:4px dashed #c4b5fd; display:flex; align-items:center; justify-content:center;
        font-size:clamp(20px,5vw,34px); font-weight:900; color:var(--ink);}
  .slot.filled{border-style:solid; border-color:#a78bfa; background:#fff;}
  .slot.ok{border-color:#22c55e; background:#dcfce7; color:#166534;}
  .slot.reveal{border-color:#f59e0b; background:#fff7e0; color:#b45309;}

  .keyboard{display:flex; flex-direction:column; gap:6px; align-items:center; margin-top:2px;}
  .krow{display:flex; gap:6px; justify-content:center; flex-wrap:wrap;}
  .key{width:clamp(32px,6vw,48px); height:clamp(36px,6.2vh,48px); border-radius:11px; border:none; cursor:pointer;
    font-family:inherit; font-weight:900; font-size:clamp(15px,3.4vw,23px); color:#fff;
    background:linear-gradient(180deg,#a78bfa,#7c3aed); box-shadow:0 5px 0 rgba(59,42,99,.25); transition:transform .08s;}
  .key:active{transform:translateY(4px); box-shadow:0 1px 0 rgba(59,42,99,.25);}
  .controls{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:8px;}
  .btn.del{background:linear-gradient(180deg,#fca5a5,#ef4444); padding:12px 20px; font-size:20px;}
  .btn.check{background:linear-gradient(180deg,#4ade80,#16a34a); padding:12px 26px; font-size:22px;}
  .btn.check:not(:disabled){animation:cpulse 1s ease-in-out infinite;}
  @keyframes cpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

  /* side panels: correct (left) / practice (right) */
  .sidepanel{position:fixed; top:76px; width:132px; max-height:78vh; z-index:6; overflow:auto;
    border-radius:20px; padding:8px 6px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:6px;}
  .sidepanel.left{left:8px; background:rgba(220,252,231,.92);}
  .sidepanel.right{right:8px; background:rgba(254,226,226,.92);}
  .sphead{font-size:14px; font-weight:900; text-align:center;}
  .sidepanel.left .sphead{color:#15803d;} .sidepanel.right .sphead{color:#b91c1c;}
  .spchips{display:flex; flex-direction:column; gap:5px;}
  .spchip{background:#fff; border-radius:14px; padding:4px 7px; box-shadow:0 3px 0 rgba(59,42,99,.1);
    display:flex; align-items:center; gap:6px; font-weight:800; font-size:14px; color:var(--ink); animation:cloudpop .4s cubic-bezier(.2,1.5,.4,1);}
  .spchip .ce{font-size:18px;}
  @keyframes cloudpop{from{transform:scale(.3); opacity:0}to{transform:scale(1); opacity:1}}
  .spchip.flying{position:fixed; z-index:70; pointer-events:none; transition:left .7s cubic-bezier(.5,0,.3,1), top .7s cubic-bezier(.5,0,.3,1), transform .7s, opacity .7s; font-size:16px;}
  @media(max-width:820px){ .sidepanel{width:88px; top:70px} .spchip{font-size:11px; padding:3px 5px} .spchip .ce{font-size:14px} }

  /* profile grid */
  .pgrid{display:flex; flex-wrap:wrap; gap:12px; justify-content:center; max-height:64vh; overflow:auto; padding:6px;}
  .pcard{width:120px; background:#fff; border-radius:18px; box-shadow:var(--shadow); padding:8px; }
  .pcard img{width:100%; height:78px; object-fit:cover; border-radius:12px; background:#eee;}
  .pcard .pf{display:none; height:78px; align-items:center; justify-content:center; font-size:52px; background:var(--soft); border-radius:12px;}
  .pcard .pw{font-weight:900; font-size:18px; margin-top:5px; text-transform:lowercase;}
  .ptier{width:100%; text-align:left; color:#fff; font-weight:900; font-size:20px; margin:14px 4px 4px; text-shadow:0 2px 6px rgba(59,42,99,.35);}

  .toast{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:40; pointer-events:none;}
  .toast .bubble{background:#fff; border-radius:26px; padding:18px 34px; font-size:clamp(26px,6vw,48px); font-weight:900;
    color:#16a34a; box-shadow:var(--shadow); animation:toastpop .5s cubic-bezier(.2,1.5,.4,1);}
  .toast.oops .bubble{color:#f59e0b;}
  @keyframes toastpop{from{transform:scale(.4); opacity:0}to{transform:scale(1); opacity:1}}
  .confetti{position:fixed; inset:0; pointer-events:none; z-index:50; overflow:hidden;}
  .confetti span{position:absolute; top:-40px; font-size:30px; animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg); opacity:.9;}}
  .badgePop{position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center;
            background:rgba(45,30,80,.82); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); animation:pop .3s;}
  .badgePop .card{max-width:420px;} .badgePop .emoji{font-size:88px;}

  .corner{position:fixed; z-index:8;} .corner.tr{top:12px; right:12px;}
  .iconbtn{width:52px; height:52px; border-radius:50%; border:none; cursor:pointer; font-size:24px;
    background:rgba(255,255,255,.92); box-shadow:0 5px 0 rgba(59,42,99,.15);}
  .iconbtn:active{transform:translateY(3px);}
  .starline{font-size:clamp(38px,9vw,66px); letter-spacing:6px; margin:4px 0;}
  .scoreBig{font-size:clamp(48px,12vw,96px); font-weight:900; color:var(--purple); margin:2px 0;}
  .wrongList{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:10px 0;}
  .wrongList .wl{background:#fff7e0; border:3px solid #fbbf24; border-radius:16px; padding:8px 12px; font-weight:900; font-size:20px; display:flex; align-items:center; gap:8px;}
  .wrongList .wl .ce{font-size:24px;}
  .muted-note{font-size:13px; opacity:.85; margin-top:10px; color:#fff;}
  .cin{width:100%; padding:11px 13px; border-radius:12px; border:2px solid #c4b5fd; font-family:inherit; font-size:16px; margin:4px 0 12px; background:#fff; color:var(--ink);}
  .clab{font-weight:800; font-size:15px; display:block; margin-top:6px;}
</style>
</head>
<body>
  <div class="bubbles" id="bubbles" aria-hidden="true"></div>
  <div id="app"></div>
  <div class="corner tr">
    <button class="iconbtn" id="fsBtn" title="Full screen">⛶</button>
    <button class="iconbtn" id="muteBtn" title="Sound on/off">🔊</button>
  </div>

<script>
/* =====================================================================
   1) LEVELS — 6 difficulty tiers. Each is a POOL of words; a round uses
   10 at a time. w = word, e = emoji (fallback). Photos: images/<w>.jpg
   ===================================================================== */
const TIERS = [
 { id:"l1", title:"Level 1", subtitle:"Little Words", emoji:"🐣", cls:"l1", words:[
   {w:"cat",e:"🐱"},{w:"dog",e:"🐶"},{w:"hat",e:"🎩"},{w:"bus",e:"🚌"},{w:"pig",e:"🐷"},{w:"cup",e:"🥤"},
   {w:"bee",e:"🐝"},{w:"fox",e:"🦊"},{w:"cow",e:"🐮"},{w:"car",e:"🚗"},{w:"bat",e:"🦇"},{w:"owl",e:"🦉"},
   {w:"egg",e:"🥚"},{w:"ant",e:"🐜"},{w:"box",e:"📦"},{w:"key",e:"🔑"} ]},
 { id:"l2", title:"Level 2", subtitle:"Fun Things", emoji:"🎈", cls:"l2", words:[
   {w:"fish",e:"🐟"},{w:"tree",e:"🌳"},{w:"frog",e:"🐸"},{w:"cake",e:"🍰"},{w:"book",e:"📖"},{w:"moon",e:"🌙"},
   {w:"duck",e:"🦆"},{w:"bird",e:"🐦"},{w:"ball",e:"⚽"},{w:"milk",e:"🥛"},{w:"lion",e:"🦁"},{w:"bear",e:"🐻"},
   {w:"boat",e:"⛵"},{w:"gift",e:"🎁"},{w:"kite",e:"🪁"},{w:"drum",e:"🥁"} ]},
 { id:"l3", title:"Level 3", subtitle:"Yummy Food", emoji:"🍎", cls:"l3", words:[
   {w:"apple",e:"🍎"},{w:"bread",e:"🍞"},{w:"pizza",e:"🍕"},{w:"grape",e:"🍇"},{w:"lemon",e:"🍋"},{w:"candy",e:"🍬"},
   {w:"donut",e:"🍩"},{w:"honey",e:"🍯"},{w:"melon",e:"🍈"},{w:"cherry",e:"🍒"},{w:"peach",e:"🍑"},{w:"carrot",e:"🥕"},
   {w:"mango",e:"🥭"},{w:"onion",e:"🧅"},{w:"banana",e:"🍌"} ]},
 { id:"l4", title:"Level 4", subtitle:"Animals", emoji:"🦁", cls:"l4", words:[
   {w:"tiger",e:"🐯"},{w:"zebra",e:"🦓"},{w:"horse",e:"🐴"},{w:"mouse",e:"🐭"},{w:"sheep",e:"🐑"},{w:"panda",e:"🐼"},
   {w:"koala",e:"🐨"},{w:"snake",e:"🐍"},{w:"whale",e:"🐳"},{w:"rabbit",e:"🐰"},{w:"monkey",e:"🐵"},{w:"turtle",e:"🐢"},
   {w:"penguin",e:"🐧"},{w:"camel",e:"🐫"},{w:"goat",e:"🐐"},{w:"shark",e:"🦈"} ]},
 { id:"l5", title:"Level 5", subtitle:"All Around", emoji:"🌈", cls:"l5", words:[
   {w:"rainbow",e:"🌈"},{w:"flower",e:"🌸"},{w:"house",e:"🏠"},{w:"train",e:"🚆"},{w:"plane",e:"✈️"},{w:"rocket",e:"🚀"},
   {w:"guitar",e:"🎸"},{w:"castle",e:"🏰"},{w:"umbrella",e:"☂️"},{w:"balloon",e:"🎈"},{w:"camera",e:"📷"},{w:"pencil",e:"✏️"},
   {w:"hammer",e:"🔨"},{w:"ladder",e:"🪜"},{w:"clock",e:"🕐"} ]},
 { id:"l6", title:"Level 6", subtitle:"Big Words", emoji:"🦖", cls:"l6", words:[
   {w:"elephant",e:"🐘"},{w:"dolphin",e:"🐬"},{w:"dinosaur",e:"🦕"},{w:"butterfly",e:"🦋"},{w:"crocodile",e:"🐊"},
   {w:"hamburger",e:"🍔"},{w:"strawberry",e:"🍓"},{w:"sunflower",e:"🌻"},{w:"octopus",e:"🐙"},{w:"kangaroo",e:"🦘"},
   {w:"pineapple",e:"🍍"},{w:"telephone",e:"☎️"},{w:"helicopter",e:"🚁"},{w:"watermelon",e:"🍉"},{w:"chocolate",e:"🍫"} ]},
];
const IMAGES = {guitar:"guitar.png", ladder:"ladder.png"};   // everything else is <word>.jpg
function imgSrc(w){ return "images/"+(IMAGES[w] || (w+".jpg")); }
const ROUND_SIZE = 10;
function timeForWord(w){ return 15 + w.length*3; }   // generous clock

const EMOJI={}; TIERS.forEach(t=>t.words.forEach(o=>EMOJI[o.w]=o.e));
const TIER_OF={}; TIERS.forEach((t,i)=>t.words.forEach(o=>TIER_OF[o.w]=i));

/* =====================================================================
   2) SAVED PROGRESS
   ===================================================================== */
/* PERMANENT keys — do NOT change these on future updates, or progress resets.
   Each PLAYER (profile) has their own save: "spellquest:<playerId>".
   Older single-profile saves are migrated into a first player automatically. */
const LEGACY_KEYS=["spellquest","spellquest_v3","spellquest_pics_v1","spellquest_v1"];
const PLAYERS_KEY="spellquest_players";
const DEFAULT={ tier:0, points:0, known:{}, practice:{}, badges:{}, muted:false };
const AVATARS=["🦁","🐯","🐼","🦊","🐨","🐸","🦄","🐵","🐧","🐙","🦖","🐢","🐝","🦋","🌟","🚀","🐰","🐳"];
function saveKeyFor(id){ return "spellquest:"+id; }
let save={...DEFAULT};                       // the CURRENT player's progress
function readKey(k){ try{ const s=localStorage.getItem(k); return s?JSON.parse(s):null; }catch(e){ return null; } }

/* ---------- the player roster (who can play) ---------- */
let roster=loadRoster();
function loadRoster(){ try{ return Object.assign({players:[],current:""}, JSON.parse(localStorage.getItem(PLAYERS_KEY))||{}); }catch(e){ return {players:[],current:""}; } }
function saveRosterLocal(){ try{ localStorage.setItem(PLAYERS_KEY,JSON.stringify(roster)); }catch(e){} }
function saveRoster(){ saveRosterLocal(); scheduleRosterPush(); }
function currentPlayer(){ return roster.players.find(p=>p.id===roster.current)||null; }
function makePlayerId(name){
  const base=(name||"player").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,20)||"player";
  let id=base,n=2; while(roster.players.some(p=>p.id===id)) id=base+"-"+(n++); return id;
}
let cloudCounts={};   // playerId -> words known, from the cloud (used before a save is downloaded)
function knownCountFor(id){ const d=readKey(saveKeyFor(id));
  if(d&&d.known) return Math.max(Object.keys(d.known).length, cloudCounts[id]||0);
  return cloudCounts[id]||0; }
/* One-time cleanup of two throwaway players ("Test", "Dad Test") that leaked in
   from development testing. Guarded by a flag so it can never touch a real
   profile you create later with a similar name. */
const CLEAN_FLAG="spellquest_cleanup_v2";
const STRAY_IDS=["t","dad-test","arjun"];
function cleanStrayPlayers(){
  try{ if(localStorage.getItem(CLEAN_FLAG)) return; }catch(e){ return; }
  const before=roster.players.length;
  roster.players=roster.players.filter(p=>!STRAY_IDS.includes(p.id));
  if(roster.players.length!==before){
    if(STRAY_IDS.includes(roster.current)) roster.current=roster.players[0]?roster.players[0].id:"";
    STRAY_IDS.forEach(id=>{ try{ localStorage.removeItem(saveKeyFor(id)); }catch(e){} });
    saveRosterLocal();
  }
  try{ localStorage.setItem(CLEAN_FLAG,"1"); }catch(e){}
}

/* first run: if there's progress from the old single-profile version, keep it as "Player 1" */
function ensureRoster(){
  if(roster.players.length) return;
  let legacy=null;
  for(const k of LEGACY_KEYS){ const o=readKey(k); if(o){ legacy=migrate(o); break; } }
  if(legacy && Object.keys(legacy.known||{}).length){
    const p={id:"player-1", name:"Player 1", emoji:"🦁"};
    roster.players=[p]; roster.current=p.id;
    try{ localStorage.setItem(saveKeyFor(p.id), JSON.stringify(normalizeSave(legacy))); }catch(e){}
    saveRosterLocal();
  }
}
/* pull the set of "known words" out of any past or present save shape */
function extractKnown(d){ const k={}; if(!d) return k;
  if(d.known) for(const w in d.known){ if(d.known[w]) k[w]=true; }
  if(d.words) for(const w in d.words){ const r=d.words[w]; if(r && (r.learned||r===true)) k[w]=true; }
  return k; }
function recomputeTier(known){ let t=0; while(t<TIERS.length && TIERS[t].words.every(o=>known[o.w])) t++; return Math.min(t, TIERS.length-1); }
function migrate(old){ const known=extractKnown(old);
  return { tier:(typeof old.tier==="number"?old.tier:recomputeTier(known)), points:Object.keys(known).length,
           known, practice:old.practice||{}, badges:old.badges||{}, muted:!!old.muted }; }
function normalizeSave(d){ const s=Object.assign({}, DEFAULT, d||{});

   (also fires immediately when muted, so callers never stall) */

/* ---------------------------------------------------------------
   SOUND DESIGN — soft mallet/bell tones through a compressor and a
   small reverb, instead of raw beeps. Notes are sine-based with a
   gentle harmonic and a smooth decay, so nothing sounds harsh.
----------------------------------------------------------------*/
let audioCtx=null, masterBus=null, verbSend=null;
function actx(){
  if(!audioCtx){ try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); buildBus(); }catch(e){ return null; } }
  if(audioCtx && audioCtx.state==="suspended") audioCtx.resume().catch(()=>{});
  return audioCtx;
}
function buildBus(){
  const c=audioCtx;
  const comp=c.createDynamicsCompressor();
  comp.threshold.value=-20; comp.knee.value=26; comp.ratio.value=3.2; comp.attack.value=.004; comp.release.value=.25;
  comp.connect(c.destination);
  masterBus=c.createGain(); masterBus.gain.value=.85; masterBus.connect(comp);
  const conv=c.createConvolver(); conv.buffer=makeIR(1.5,2.4); conv.connect(comp);
  verbSend=c.createGain(); verbSend.gain.value=.22; verbSend.connect(conv);
}
function makeIR(sec,decay){                     // tiny synthetic room, keeps tones from sounding dry/cheap
  const c=audioCtx, rate=c.sampleRate, len=Math.max(1,Math.floor(rate*sec));
  const buf=c.createBuffer(2,len,rate);
  for(let ch=0;ch<2;ch++){ const d=buf.getChannelData(ch);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay); }
  return buf;
}
/* one rounded note: fundamental + soft octave partial, lowpassed, smooth decay */
function note(freq,{at=0,dur=.5,gain=.15,send=.25,type="sine",bright=5}={}){
  const c=actx(); if(!c||save.muted) return;
  const t=c.currentTime+at;
  const o=c.createOscillator(), o2=c.createOscillator();
  const g=c.createGain(), g2=c.createGain(), lp=c.createBiquadFilter();
  o.type=type; o.frequency.value=freq;
  o2.type="sine"; o2.frequency.value=freq*2.005; g2.gain.value=.16;
  lp.type="lowpass"; lp.frequency.value=Math.min(freq*bright,8000); lp.Q.value=.5;
  o.connect(g); o2.connect(g2); g2.connect(g); g.connect(lp); lp.connect(masterBus);
  if(send>0 && verbSend){ const s=c.createGain(); s.gain.value=send; lp.connect(s); s.connect(verbSend); }
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(gain,t+.008);        // quick, click-free attack
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.start(t); o2.start(t); o.stop(t+dur+.05); o2.stop(t+dur+.05);
}

/* =====================================================================
   6) ROUND ENGINE
   ===================================================================== */
let round=null;
let timer={id:null,total:0,left:0};
let word="", emoji="", slotEls=[], typed=[], solved=false, keyHandler=null;

function clearTimer(){ if(timer.id){ clearInterval(timer.id); timer.id=null; } }
function cleanupWord(){ clearTimer(); if(keyHandler){ document.removeEventListener("keydown",keyHandler); keyHandler=null; } }

/* pick the 10 words for a round: carried-over wrong words + new same-level words */
function buildRound(ti){
  const pool=TIERS[ti].words.map(o=>o.w);
  const practice=(save.practice[ti]||[]).filter(w=>pool.includes(w));
  let list=[...practice];
  for(const w of shuffle(pool)){ if(list.length>=ROUND_SIZE) break; if(!save.known[w] && !list.includes(w)) list.push(w); }
  for(const w of shuffle(pool)){ if(list.length>=ROUND_SIZE) break; if(!list.includes(w)) list.push(w); } // review knowns to fill
  let k=0; while(list.length<ROUND_SIZE){ list.push(pool[k%pool.length]); k++; }                          // last resort
  return shuffle(list.slice(0,ROUND_SIZE)).map(w=>({w, e:EMOJI[w]}));
}
function startTier(ti){
  enterFullscreen();
  round={ ti, words:buildRound(ti), i:0, correct:[], wrong:[] };
  renderWord();
}

const KEYROWS=["ABCDEFG","HIJKLMN","OPQRSTU","VWXYZ"];
function stagePic(){
  return `<img class="picture" id="pic" alt="" src="${imgSrc(word)}"
      onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
    <div class="picfallback">${emoji}</div>`;
}

function renderWord(){
  cleanupWord(); app.classList.add("playing");
  const obj=round.words[round.i]; word=obj.w; emoji=obj.e; typed=[]; solved=false;
  const total=round.words.length; const pct=Math.round(round.i/total*100);
  app.innerHTML=`
    <div class="sidepanel left"><div class="sphead">✅ Got it!</div><div class="spchips">
      ${round.correct.map(o=>`<div class="spchip"><span class="ce">${o.e}</span>${o.w}</div>`).join("")}</div></div>
    <div class="sidepanel right"><div class="sphead">📚 Practice</div><div class="spchips">
      ${round.wrong.map(o=>`<div class="spchip"><span class="ce">${o.e}</span>${o.w}</div>`).join("")}</div></div>
    <div class="screen">
      <div class="top">
        <button class="btn ghost" id="quit">⬅</button>
        <div class="timerwrap"><div class="tbar"><i id="tbar"></i></div><div class="chip tsec" id="tsec">⏱ --</div></div>
        <div class="chip">${Math.min(round.i+1,total)}/${total}</div>
      </div>
      <div class="card">
        <div class="picwrap">${stagePic()}</div>
        <button class="speaker" id="spk">🔊</button>
        <div class="slots" id="slots"></div>
        <div class="keyboard" id="kb">
          ${KEYROWS.map(r=>`<div class="krow">${[...r].map(l=>`<button class="key" data-k="${l}">${l}</button>`).join("")}</div>`).join("")}
        </div>
        <div class="controls">
          <button class="btn del" id="bksp">⌫ Delete</button>
          <button class="btn check" id="check" disabled>✓ Check!</button>
        </div>
      </div>
    </div>`;
  slotEls=[]; const slots=document.getElementById("slots");
  for(let i=0;i<word.length;i++){ const d=document.createElement("div"); d.className="slot"; slots.appendChild(d); slotEls.push(d); }

  document.getElementById("quit").onclick=()=>{ sfxClick(); cleanupWord(); showHome(); };
  document.getElementById("spk").onclick=()=>{ sfxClick(); sayWord(word); };
  document.getElementById("bksp").onclick=backspace;
  document.getElementById("check").onclick=submit;
  document.querySelectorAll("#kb .key[data-k]").forEach(b=>{ b.onclick=()=>pressLetter(b.dataset.k.toLowerCase()); });
  keyHandler=(e)=>{ if(e.metaKey||e.ctrlKey||e.altKey) return;
    if(e.key==="Backspace"){ e.preventDefault(); backspace(); }
    else if(e.key==="Enter"){ if(typed.length===word.length) submit(); }
    else if(/^[a-zA-Z]$/.test(e.key)){ pressLetter(e.key.toLowerCase()); } };
  document.addEventListener("keydown",keyHandler);

  updateSlots(); sayWord(word); startTimer(timeForWord(word));
}

function updateSlots(){ slotEls.forEach((el,i)=>{ el.textContent=(typed[i]||"").toUpperCase();
    el.className="slot"+(typed[i]?" filled":""); });
  const c=document.getElementById("check"); if(c) c.disabled = typed.length!==word.length; }
function pressLetter(l){ if(solved) return; if(typed.length<word.length){ typed.push(l); sfxKey(); updateSlots(); } }
function backspace(){ if(solved) return; if(typed.length){ typed.pop(); sfxKey(); updateSlots(); } }

function startTimer(seconds){
  clearTimer(); timer.total=seconds; timer.left=seconds;
  const bar=document.getElementById("tbar"), sec=document.getElementById("tsec");
  const paint=()=>{ const r=Math.max(0,timer.left/timer.total); if(bar){ bar.style.width=(r*100)+"%";
      bar.style.background=r>.5?"linear-gradient(90deg,#4ade80,#22c55e)":r>.25?"linear-gradient(90deg,#fbbf24,#f59e0b)":"linear-gradient(90deg,#fb7185,#ef4444)"; }
    if(sec) sec.textContent="⏱ "+Math.ceil(timer.left)+"s"; };
  paint();
  timer.id=setInterval(()=>{ timer.left-=0.1;
    if(timer.left<=5 && Math.abs(timer.left-Math.round(timer.left))<0.05 && timer.left>0) sfxTick();
    if(timer.left<=0){ timer.left=0; paint(); clearTimer(); submit(true); } else paint(); },100);
}

function submit(timeUp){
  if(solved) return; solved=true; cleanupWord();
  const correct = typed.join("")===word;
  if(correct) onCorrect(); else onWrong(!!timeUp);
}

function onCorrect(){
  const obj=round.words[round.i];
  round.correct.push(obj);
  const wasKnown=!!save.known[word];
  save.known[word]=true; save.points++; removePractice(round.ti, word);
  persist();
  slotEls.forEach(el=>el.classList.add("ok"));
  sfxCorrect(); confetti(18);
  toast(rand(["Yes!","Great!","Woohoo!","⭐","Nice!"]));
  flyToPanel("left", emoji, word);
  round.i++;
  const go=once(()=>flushBadges(()=>{ round.i<round.words.length?renderWord():roundEnd(); }));
  playPraise(()=>setTimeout(go,450));       // wait for the praise to finish speaking
  setTimeout(go, 6000);                      // safety net if audio can't play
}

function onWrong(timeUp){
  const obj=round.words[round.i];
  round.wrong.push(obj); addPractice(round.ti, word); persist();
  typed=[...word]; updateSlots(); slotEls.forEach(el=>el.className="slot reveal");
  const c=document.getElementById("check"); if(c) c.disabled=true;
  sfxWrong();
  toast(timeUp?"Time's up! ⏰":"Let's learn it! 😊", false);
  flyToPanel("right", emoji, word);
  round.i++;
  /* stay on the word until it has been spelled out in full, THEN move on */
  const go=once(()=>{ round.i<round.words.length?renderWord():roundEnd(); });
  setTimeout(()=>spellOutWord(word, ()=>setTimeout(go,800)), 400);
  setTimeout(go, 20000);                     // safety net if audio can't play
}
/* run a callback at most once, whichever trigger fires first */
function once(fn){ let done=false; return ()=>{ if(done) return; done=true; fn(); }; }

function flyToPanel(side, emo, wd){
  const panel=document.querySelector(".sidepanel."+side); const slots=document.getElementById("slots");
  if(!panel||!slots) return;
  const from=slots.getBoundingClientRect(), to=panel.getBoundingClientRect();
  const fly=document.createElement("div"); fly.className="spchip flying";
  fly.innerHTML=`<span class="ce">${emo}</span>${wd}`;
  fly.style.left=(from.left+from.width/2-28)+"px"; fly.style.top=(from.top)+"px";
  document.body.appendChild(fly);
  requestAnimationFrame(()=>{ fly.style.left=(side==="left"?to.left+16:to.left+16)+"px"; fly.style.top=(to.top+34)+"px"; fly.style.transform="scale(.7)"; fly.style.opacity="0.15"; });
  setTimeout(()=>fly.remove(),760);
}

function roundEnd(){
  cleanupWord(); app.classList.remove("playing"); stopAudio();
  const ti=round.ti, L=TIERS[ti];
  const score=round.correct.length, perfect=score===ROUND_SIZE;
  let unlockedNext=false, champion=false;
  if(perfect){
    save._perfect=true;
    if(ti===save.tier && save.tier<TIERS.length-1){ save.tier++; unlockedNext=true; }
    else if(ti===save.tier && save.tier===TIERS.length-1){ champion = TIERS.every((t)=>t.words.every(o=>save.known[o.w])); }
    persist();
  }
  flushCloudPush();                 // don't wait — save the finished round right away
  sfxWin(); confetti(perfect?46:16);
  if(perfect) playPhrase("perfect","Perfect! Ten out of ten!"); else playPhrase("welldone","Good work! Keep practicing.");
  const stars="⭐".repeat(Math.max(1,Math.min(3, Math.round(score/10*3)||1)));
  const wrongHtml = round.wrong.length? `
      <div style="font-size:20px;font-weight:900;color:#b45309;margin-top:12px">📚 Words to practice next time:</div>
      <div class="wrongList">${round.wrong.map(o=>`<div class="wl"><span class="ce">${o.e}</span>${o.w}</div>`).join("")}</div>` : "";
  app.innerHTML=`
    <div class="screen"><div class="card">
      <div style="font-size:64px">${perfect?"🏆":"🌟"}</div>
      <h2 style="color:${perfect?"#16a34a":"#7c3aed"};font-size:clamp(26px,6vw,44px);margin:4px 0">${perfect?"Perfect Round!":"Round Complete!"}</h2>
      <div class="scoreBig">${score} / 10</div>
      <div class="starline">${stars}</div>
      ${perfect && unlockedNext? `<p style="font-size:21px;color:#7c3aed;font-weight:900;margin:8px 0">🔓 ${TIERS[ti+1].title} unlocked!</p>`:""}
      ${perfect && champion? `<p style="font-size:21px;color:#7c3aed;font-weight:900;margin:8px 0">🏆 You finished every level — Champion!</p>`:""}
      ${wrongHtml}
      <div class="controls" style="margin-top:16px">
        ${perfect && unlockedNext? `<button class="btn play big" id="next">Next Level ➡</button>`:""}
        ${!perfect? `<button class="btn play big" id="again">Keep Practicing 💪</button>`:""}
        ${perfect && !unlockedNext? `<button class="btn blue" id="again">Play Again 🔁</button>`:""}
        <button class="btn pink" id="prof">👤 My Words</button>
        <button class="btn ghost" id="home">🏠 Home</button>
      </div>
    </div></div>`;
  const nx=document.getElementById("next"); if(nx) nx.onclick=()=>{ sfxClick(); startTier(save.tier); };
  const ag=document.getElementById("again"); if(ag) ag.onclick=()=>{ sfxClick(); startTier(ti); };
  document.getElementById("prof").onclick=()=>{ sfxClick(); showProfile(); };
  document.getElementById("home").onclick=()=>{ sfxClick(); showHome(); };
  flushBadges();
}
