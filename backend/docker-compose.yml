services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: adaptive
      POSTGRES_PASSWORD: adaptive
      POSTGRES_DB: adaptive
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adaptive"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql+psycopg://adaptive:adaptive@db:5432/adaptive
      ENVIRONMENT: docker
      SEED_ON_START: "1"
    ports: ["8000:8000"]
    volumes:
      # Photos and audio live in the repo root, one level up.
      - ../images:/images:ro
      - ../audio:/audio:ro
      - ../web:/web:ro
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
